    <text x="16" y="44" fill="#94A3B8" class="font-sans" font-size="11">Dense embeddings &amp; provenance</text>

    <g transform="translate(16, 60)">
      <rect y="0" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="14" fill="#F1F5F9" class="font-mono" font-size="10">Pinecone DB</text>

      <rect x="115" y="0" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="123" y="14" fill="#F1F5F9" class="font-mono" font-size="10">FAISS Index</text>

      <rect y="26" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="40" fill="#F1F5F9" class="font-mono" font-size="10">Embeddings</text>

      <rect x="115" y="26" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="123" y="40" fill="#F1F5F9" class="font-mono" font-size="10">Rerankers</text>

      <rect y="52" width="220" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="66" fill="#C4B5FD" class="font-mono" font-size="9.5">ZERO-HALLUCINATION PROVENANCE</text>
    </g>
  </g>

  <!-- Pillar 4: Computer Vision & ML -->
  <g transform="translate(898, 52)">
    <rect width="274" height="154" rx="8" fill="#121827" stroke="#253047" stroke-width="1" />
    <text x="16" y="26" fill="#94A3B8" class="font-head" font-size="13.5">Vision &amp; Predictive ML</text>
    <text x="16" y="44" fill="#94A3B8" class="font-sans" font-size="11">Biometrics, landmarks, ensembles</text>

    <g transform="translate(16, 60)">
      <rect y="0" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="14" fill="#F1F5F9" class="font-mono" font-size="10">OpenCV</text>

      <rect x="115" y="0" width="115" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="123" y="14" fill="#F1F5F9" class="font-mono" font-size="10">MediaPipe</text>

      <rect y="26" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="40" fill="#F1F5F9" class="font-mono" font-size="10">Scikit-Learn</text>

      <rect x="115" y="26" width="115" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="123" y="40" fill="#F1F5F9" class="font-mono" font-size="10">PyTorch</text>

      <rect y="52" width="230" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="66" fill="#94A3B8" class="font-mono" font-size="9.5">REAL-TIME INFERENCE PIPELINES</text>
    </g>
