      <rect x="115" y="0" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="123" y="14" fill="#F1F5F9" class="font-mono" font-size="10">MySQL</text>

      <rect y="26" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="40" fill="#F1F5F9" class="font-mono" font-size="10">MongoDB</text>

      <rect x="115" y="26" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="123" y="40" fill="#F1F5F9" class="font-mono" font-size="10">Firebase</text>

      <rect y="52" width="220" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="66" fill="#C4B5FD" class="font-mono" font-size="9.5">SCHEMA INTEGRITY · QUERY DESIGN</text>
