<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D111B" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>
    <linearGradient id="innerCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121827" />
      <stop offset="100%" stop-color="#0D111B" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#253047" />
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#253047" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'Geist Mono', 'JetBrains Mono', 'Courier New', monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-head { font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
  </style>

  <!-- Container Base -->
  <rect width="1200" height="240" rx="14" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1" />

  <!-- Top Window Header Bar -->
  <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 1186 0 C 1193.732 0 1200 6.268 1200 14 L 1200 38 L 0 38 Z" fill="#121827" />
  <line x1="0" y1="38" x2="1200" y2="38" stroke="#253047" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="28" cy="19" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="44" cy="19" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="60" cy="19" r="4.5" fill="#10B981" opacity="0.8" />
  
  <text x="86" y="23" fill="#64748B" class="font-mono" font-size="11" letter-spacing="1">PROFILE.IDENTITY // S PRAVEEN KUMAR</text>
  <text x="1170" y="23" text-anchor="end" fill="#22D3EE" class="font-mono" font-size="10.5" letter-spacing="1.5">● STATUS: ACTIVE</text>

  <!-- 3 Inner Strategic Cards -->
  <!-- Card 1: Academic & Affiliation -->
  <g transform="translate(24, 52)">
    <rect width="365" height="168" rx="10" fill="url(#innerCardBg)" stroke="#253047" stroke-width="1" />
    <text x="18" y="26" fill="#22D3EE" class="font-mono" font-size="10.5" letter-spacing="1.5">01 // ACADEMIC FOUNDATION</text>
    <text x="18" y="52" fill="#F1F5F9" class="font-head" font-size="16">Sathyabama Institute</text>
    <text x="18" y="70" fill="#94A3B8" class="font-sans" font-size="12">of Science &amp; Technology, Chennai</text>
    
    <rect x="18" y="86" width="329" height="1" fill="#253047" />
    
    <text x="18" y="108" fill="#818CF8" class="font-mono" font-size="11.5">B.E. Computer Science (AI &amp; ML)</text>
    <text x="18" y="126" fill="#64748B" class="font-mono" font-size="11">Cohort: 2024 – 2028 · 4-Year Program</text>
    
    <g transform="translate(18, 138)">
      <rect width="180" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="10" y="14" fill="#22D3EE" class="font-mono" font-size="9.5">PRESIDENT, MICROSOFT CLUB</text>
    </g>
  </g>

  <!-- Card 2: Core Focus Areas -->
  <g transform="translate(417, 52)">
    <rect width="365" height="168" rx="10" fill="url(#innerCardBg)" stroke="#253047" stroke-width="1" />
    <text x="18" y="26" fill="#818CF8" class="font-mono" font-size="10.5" letter-spacing="1.5">02 // CORE DOMAIN RADAR</text>
    
    <g transform="translate(18, 42)">
      <circle cx="4" cy="6" r="3" fill="#22D3EE" />
      <text x="14" y="10" fill="#F1F5F9" class="font-sans" font-size="12.5" font-weight="600">Autonomous AI &amp; Agent Systems</text>
      <text x="14" y="24" fill="#94A3B8" class="font-sans" font-size="11">LangChain, LangGraph, Multi-Agent loops</text>
    </g>

    <g transform="translate(18, 78)">
      <circle cx="4" cy="6" r="3" fill="#818CF8" />
      <text x="14" y="10" fill="#F1F5F9" class="font-sans" font-size="12.5" font-weight="600">Enterprise RAG &amp; Vector Retrieval</text>
      <text x="14" y="24" fill="#94A3B8" class="font-sans" font-size="11">FAISS, Pinecone, Hybrid Search, Rerankers</text>
    </g>

    <g transform="translate(18, 114)">
      <circle cx="4" cy="6" r="3" fill="#A78BFA" />
      <text x="14" y="10" fill="#F1F5F9" class="font-sans" font-size="12.5" font-weight="600">High-Throughput Full-Stack</text>
      <text x="14" y="24" fill="#94A3B8" class="font-sans" font-size="11">FastAPI, Next.js, TypeScript, Docker, SQL</text>
    </g>
  </g>

  <!-- Card 3: Engineering Philosophy -->
  <g transform="translate(810, 52)">
    <rect width="365" height="168" rx="10" fill="url(#innerCardBg)" stroke="#253047" stroke-width="1" />
    <text x="18" y="26" fill="#A78BFA" class="font-mono" font-size="10.5" letter-spacing="1.5">03 // ENGINEERING MANIFESTO</text>
    <text x="18" y="58" fill="#F1F5F9" class="font-head" font-size="15">Full-Lifecycle Craft</text>
    
    <text x="18" y="82" fill="#94A3B8" class="font-sans" font-size="11.5" line-height="1.5">
      <tspan x="18" dy="0">"Passionate about building intelligent software,</tspan>
      <tspan x="18" dy="16">exploring emerging AI technologies, and</tspan>
      <tspan x="18" dy="16">engineering products that solve practical</tspan>
      <tspan x="18" dy="16">problems with production reliability."</tspan>
    </text>

    <g transform="translate(18, 138)">
      <rect width="329" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="12" y="14" fill="#64748B" class="font-mono" font-size="9.5">DESIGN  →  APIS  →  AI INTEGRATION  →  SHIP</text>
    </g>
  </g>
</svg>
