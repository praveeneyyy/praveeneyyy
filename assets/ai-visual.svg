<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D111B" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>
    <linearGradient id="aiBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#253047" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#253047" />
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: 'Geist Mono', 'JetBrains Mono', 'Courier New', monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-head { font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
  </style>

  <rect width="1200" height="230" rx="14" fill="url(#aiCardBg)" stroke="url(#aiBorder)" stroke-width="1" />

  <!-- Section Header -->
  <g transform="translate(28, 30)">
    <rect width="8" height="8" rx="2" fill="#22D3EE" />
    <text x="18" y="8" fill="#22D3EE" class="font-mono" font-size="11" letter-spacing="1.5">STACK TAXONOMY // 01 · ARTIFICIAL INTELLIGENCE &amp; MACHINE LEARNING</text>
  </g>

  <!-- 4 AI Pillars -->
  <!-- Pillar 1: Generative & LLM Orchestration -->
  <g transform="translate(28, 52)">
    <rect width="270" height="154" rx="8" fill="#121827" stroke="#253047" stroke-width="1" />
    <text x="16" y="26" fill="#22D3EE" class="font-head" font-size="13.5">Foundation &amp; LLMs</text>
    <text x="16" y="44" fill="#94A3B8" class="font-sans" font-size="11">Multi-turn reasoning &amp; prompting</text>
    
    <g transform="translate(16, 60)">
      <rect y="0" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="14" fill="#F1F5F9" class="font-mono" font-size="10">Google Gemini</text>
      
      <rect x="115" y="0" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="123" y="14" fill="#F1F5F9" class="font-mono" font-size="10">OpenAI API</text>
      
      <rect y="26" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="40" fill="#F1F5F9" class="font-mono" font-size="10">LangChain</text>

      <rect x="115" y="26" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="123" y="40" fill="#F1F5F9" class="font-mono" font-size="10">Transformers</text>

      <rect y="52" width="220" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="66" fill="#67E8F9" class="font-mono" font-size="9.5">PROMPT OPTIMIZATION</text>
    </g>
  </g>

  <!-- Pillar 2: Agentic AI & Workflows -->
  <g transform="translate(318, 52)">
    <rect width="270" height="154" rx="8" fill="#121827" stroke="#253047" stroke-width="1" />
    <text x="16" y="26" fill="#818CF8" class="font-head" font-size="13.5">Agentic Workflows</text>
    <text x="16" y="44" fill="#94A3B8" class="font-sans" font-size="11">Self-critique &amp; tool dispatch</text>

    <g transform="translate(16, 60)">
      <rect y="0" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="14" fill="#F1F5F9" class="font-mono" font-size="10">LangGraph</text>

      <rect x="115" y="0" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="123" y="14" fill="#F1F5F9" class="font-mono" font-size="10">Multi-Agent</text>

      <rect y="26" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="40" fill="#F1F5F9" class="font-mono" font-size="10">State Graphs</text>

      <rect x="115" y="26" width="105" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="123" y="40" fill="#F1F5F9" class="font-mono" font-size="10">Tool Calling</text>

      <rect y="52" width="220" height="20" rx="4" fill="#080B12" stroke="#253047" stroke-width="0.8" />
      <text x="8" y="66" fill="#A5B4FC" class="font-mono" font-size="9.5">AUTONOMOUS REASONING</text>
    </g>
  </g>

  <!-- Pillar 3: RAG & Vector Intelligence -->
  <g transform="translate(608, 52)">
    <rect width="270" height="154" rx="8" fill="#121827" stroke="#253047" stroke-width="1" />
