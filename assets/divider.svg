<svg width="1200" height="24" viewBox="0 0 1200 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Conduit Gradient -->
    <linearGradient id="divConduitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04060d" stop-opacity="0" />
      <stop offset="12%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#0e75b6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#6C63FF" stop-opacity="0.5" />
      <stop offset="88%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#04060d" stop-opacity="0" />
    </linearGradient>

    <!-- Traveling Forward Photon Pulse Beam -->
    <linearGradient id="divPhotonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#67e8f9" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Traveling Return Echo Beam -->
    <linearGradient id="divEchoGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#6C63FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="divGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Static Precision Track Line -->
  <line x1="30" y1="12" x2="1170" y2="12" stroke="url(#divConduitGrad)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Technical Node Accents along the track -->
  <g fill="#22d3ee" opacity="0.3">
    <circle cx="200" cy="12" r="1.2" />
    <circle cx="380" cy="12" r="1.2" />
    <circle cx="820" cy="12" r="1.2" />
    <circle cx="1000" cy="12" r="1.2" />
  </g>

  <!-- Forward Traveling High-Energy Photon Packet -->
  <line x1="-160" y1="12" x2="0" y2="12" stroke="url(#divPhotonGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#divGlowFilter)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 1360,0"
      dur="4.2s"
      repeatCount="indefinite" />
  </line>

  <!-- Reverse Micro-Echo Beam -->
  <line x1="1200" y1="12" x2="1320" y2="12" stroke="url(#divEchoGrad)" stroke-width="1.8" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -1360,0"
      dur="6.8s"
      repeatCount="indefinite" />
  </line>

  <!-- Central Quantum Node Geometry -->
  <g transform="translate(600, 12)">
    <!-- Expanding Radar Ring -->
    <circle cx="0" cy="0" r="7" fill="none" stroke="#22d3ee" stroke-width="0.75" opacity="0.5">
      <animate attributeName="r" values="4;10;4" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" repeatCount="indefinite" />
    </circle>

    <!-- Outer Symmetrical Brackets -->
    <path d="M -16 -4 L -20 0 L -16 4" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" fill="none" />
    <path d="M 16 -4 L 20 0 L 16 4" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" fill="none" />

    <!-- Center Diamond Housing -->
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#060914" stroke="#22d3ee" stroke-width="1.4" />

    <!-- Pulsing Luminous Core -->
    <circle cx="0" cy="0" r="2.2" fill="#22d3ee" filter="url(#divGlowFilter)">
      <animate attributeName="fill" values="#22d3ee;#6C63FF;#22d3ee" dur="3.6s" repeatCount="indefinite" />
      <animate attributeName="r" values="1.8;2.6;1.8" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
