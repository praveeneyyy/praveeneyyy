<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nowCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#030408" />
    </linearGradient>

    <!-- Moving Shimmer Border Gradient -->
    <linearGradient id="nowShimmerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#6C63FF" stop-opacity="0.9">
        <animate attributeName="offset" values="0.1; 0.85; 0.1" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.95">
        <animate attributeName="offset" values="0.3; 0.95; 0.3" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ambient Aurora Glows -->
    <radialGradient id="nowGlowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0e75b6" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#0e75b6" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0e75b6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nowGlowRight" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#6C63FF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0" />
    </radialGradient>

    <!-- Column Divider Line Gradient -->
    <linearGradient id="nowColDiv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="25%" stop-color="#22d3ee" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#6C63FF" stop-opacity="0.55" />
      <stop offset="75%" stop-color="#22d3ee" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="nowGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#22d3ee" stroke-width="0.6" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <style>
    .now-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .now-sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Base Rectangle -->
  <rect width="1200" height="260" rx="18" fill="url(#nowCardBg)" />
  <rect width="1200" height="260" rx="18" fill="url(#nowGlowLeft)" />
  <rect width="1200" height="260" rx="18" fill="url(#nowGlowRight)" />
  <rect width="1200" height="260" rx="18" fill="url(#nowGrid)" />

  <!-- Top Window Header Bar -->
  <g transform="translate(36, 36)">
    <!-- Terminal Window Dots -->
    <circle cx="8" cy="-2" r="5" fill="#ef4444" opacity="0.75" />
    <circle cx="26" cy="-2" r="5" fill="#eab308" opacity="0.75" />
    <circle cx="44" cy="-2" r="5" fill="#22c55e" opacity="0.75" />

    <text class="now-mono" x="72" y="2" font-size="12" font-weight="600" fill="#22d3ee" letter-spacing="1.5">
      // 02. ACTIVE ROADMAP &amp; RESEARCH RADAR
    </text>
    <text class="now-mono" x="1128" y="2" text-anchor="end" font-size="10.5" font-weight="500" fill="#64748B" letter-spacing="1">
      TELEMETRY // SYNCHRONIZED
    </text>
  </g>

  <!-- Vertical Column Divider -->
  <line x1="592" y1="52" x2="592" y2="238" stroke="url(#nowColDiv)" stroke-width="1.2" />

  <!-- LEFT COLUMN: CURRENTLY BUILDING -->
  <g transform="translate(36, 68)">
    <g transform="translate(0, 0)">
      <rect x="0" y="-14" width="225" height="25" rx="5" fill="#0b172a" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="14" cy="-1.5" r="3" fill="#22d3ee">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text class="now-mono" x="26" y="2.5" font-size="11" font-weight="600" fill="#22d3ee" letter-spacing="1">
        ⚡ CURRENTLY BUILDING
      </text>
    </g>

    <!-- Items -->
    <g transform="translate(4, 30)">
      <!-- Item 1 -->
      <polygon points="0,0 6,4 0,8" fill="#22d3ee" />
      <text class="now-sans" x="16" y="6" font-size="13" font-weight="500" fill="#F8FAFC">
        TAILR Engine <tspan fill="#94A3B8" font-size="12">— Multi-agent job matching &amp; resume optimization</tspan>
      </text>

      <!-- Item 2 -->
      <polygon points="0,28 6,32 0,36" fill="#22d3ee" />
      <text class="now-sans" x="16" y="34" font-size="13" font-weight="500" fill="#F8FAFC">
        Production RAG <tspan fill="#94A3B8" font-size="12">— Hybrid semantic chunking, FAISS &amp; rerankers</tspan>
      </text>

      <!-- Item 3 -->
      <polygon points="0,56 6,60 0,64" fill="#22d3ee" />
      <text class="now-sans" x="16" y="62" font-size="13" font-weight="500" fill="#F8FAFC">
        FastAPI Microservices <tspan fill="#94A3B8" font-size="12">— Async REST backends with Pydantic validation</tspan>
      </text>

      <!-- Item 4 -->
      <polygon points="0,84 6,88 0,92" fill="#22d3ee" />
      <text class="now-sans" x="16" y="90" font-size="13" font-weight="500" fill="#F8FAFC">
        Next.js &amp; TS Dashboards <tspan fill="#94A3B8" font-size="12">— Interactive reactive client applications</tspan>
      </text>

      <!-- Item 5 -->
      <polygon points="0,112 6,116 0,120" fill="#22d3ee" />
      <text class="now-sans" x="16" y="118" font-size="13" font-weight="500" fill="#F8FAFC">
        Docker Deployments <tspan fill="#94A3B8" font-size="12">— Containerized multi-service cloud staging</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: CURRENTLY LEARNING -->
  <g transform="translate(628, 68)">
    <g transform="translate(0, 0)">
      <rect x="0" y="-14" width="245" height="25" rx="5" fill="#14112e" stroke="#6C63FF" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="14" cy="-1.5" r="3" fill="#6C63FF">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text class="now-mono" x="26" y="2.5" font-size="11" font-weight="600" fill="#c4b5fd" letter-spacing="1">
        🌱 EXPLORING &amp; LEARNING
      </text>
    </g>

    <!-- Items -->
    <g transform="translate(4, 30)">
      <!-- Item 1 -->
      <polygon points="0,0 6,4 0,8" fill="#6C63FF" />
      <text class="now-sans" x="16" y="6" font-size="13" font-weight="500" fill="#F8FAFC">
        Autonomous AI Agents <tspan fill="#94A3B8" font-size="12">— Graph memory, reflection &amp; supervisor loops</tspan>
      </text>

      <!-- Item 2 -->
      <polygon points="0,28 6,32 0,36" fill="#6C63FF" />
      <text class="now-sans" x="16" y="34" font-size="13" font-weight="500" fill="#F8FAFC">
        Distributed Systems <tspan fill="#94A3B8" font-size="12">— Message brokers, consensus &amp; caching strategies</tspan>
      </text>

      <!-- Item 3 -->
      <polygon points="0,56 6,60 0,64" fill="#6C63FF" />
      <text class="now-sans" x="16" y="62" font-size="13" font-weight="500" fill="#F8FAFC">
        System Design <tspan fill="#94A3B8" font-size="12">— High-concurrency architectures &amp; reliability</tspan>
      </text>

      <!-- Item 4 -->
      <polygon points="0,84 6,88 0,92" fill="#6C63FF" />
      <text class="now-sans" x="16" y="90" font-size="13" font-weight="500" fill="#F8FAFC">
        Kubernetes Orchestration <tspan fill="#94A3B8" font-size="12">— Pod autoscaling, ingress &amp; cluster management</tspan>
      </text>

      <!-- Item 5 -->
      <polygon points="0,112 6,116 0,120" fill="#6C63FF" />
      <text class="now-sans" x="16" y="118" font-size="13" font-weight="500" fill="#F8FAFC">
        Production MLOps <tspan fill="#94A3B8" font-size="12">— Model lineage, drift detection &amp; CI/CD eval</tspan>
      </text>
    </g>
  </g>

  <!-- Exterior Shimmer Border -->
  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="url(#nowShimmerBorder)" stroke-width="1.5" />
</svg>
